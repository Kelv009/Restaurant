<!DOCTYPE html>
<html>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }
        h1{
            text-align: center;
            padding: 20px;
        }
        .gallery{
            display: grid;
            grid-template-columns: repeat(auto-fit, minimax(250px,1fr));
            gap: 15px;
            padding: 20px;
        }
        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
    </style>
    <body>
        <h1>The Gallery. Explore our collections</h1>
        <div class="gallery">
            <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4" alt="">
            <img src="https://images.unsplash.com/photo-1559339352-11d035aa65de" alt="">
            <img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe" alt="">
            <img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0" alt="">
            <img src="https://images.unsplash.com/photo-1552566626-52f8b828add9" alt="">
            <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836" alt="">
        </div>
    </body>
</html>
